<header class="page-header"><a href="../index.html">← 경기 목록</a><h1 id="heading"></h1><p id="game-summary" class="muted"></p><p class="muted">battle-viewer-ui-v1 · 공개 기록과 모델이 실제 받은 입력을 구분합니다.</p></header>

<main class="layout"><div class="main">
